<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GengarTally</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#18181b">
  <link rel="apple-touch-icon" href="gengar.png">
  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100%; max-width: 100vw; overflow-x: hidden; touch-action: pan-y; }
    body { background-color: #09090b; color: #f4f4f5; display: flex; justify-content: center; min-height: 100vh; padding: 10px 12px 24px; }
    .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 10px; overflow-x: hidden; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 4px 2px; }
    h1 { font-size: 1.25rem; font-weight: 700; color: #fff; }
    .btn-text { background: #27272a; border: 1px solid #3f3f46; color: #a1a1aa; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }

    /* 頂部導航分頁 */
    .nav-tabs {
      display: flex; background: #18181b; border: 1px solid #27272a; 
      border-radius: 12px; padding: 3px; gap: 4px;
    }
    .tab-btn {
      flex: 1; background: transparent; border: none; color: #71717a; 
      padding: 8px 0; border-radius: 9px; font-size: 0.88rem; font-weight: 700; 
      cursor: pointer; transition: all 0.2s ease;
    }
    .tab-btn.active { background: #27272a; color: #fff; border: 1px solid #3f3f46; }

    /* 雙分頁架構：100% 寬度零溢出切換 */
    .page-view {
      width: 100%;
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .page-view.active { display: flex; }
    .page-view.slide-left {
      animation: slideLeft 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .page-view.slide-right {
      animation: slideRight 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideLeft {
      from { opacity: 0.5; transform: translateX(25px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideRight {
      from { opacity: 0.5; transform: translateX(-25px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* 表單與卡片容器 */
    .card { background: #18181b; border: 1px solid #27272a; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    
    .date-row { display: flex; gap: 8px; align-items: center; }
    .date-input { flex: 1; background: #09090b; border: 1px solid #3f3f46; color: #fff; padding: 10px; border-radius: 8px; font-size: 0.95rem; outline: none; }
    .btn-today { background: #3f3f46; border: none; color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }

    .item-group { display: flex; flex-direction: column; gap: 6px; }
    .text-input { background: #09090b; border: 1px solid #3f3f46; color: #fff; padding: 11px 12px; border-radius: 8px; font-size: 0.95rem; outline: none; }
    .text-input:focus { border-color: #818cf8; }

    /* 常用項目快捷膠囊滑動條 */
    .quick-scroll {
      display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 4px;
      scrollbar-width: none; touch-action: pan-x; overscroll-behavior-x: contain;
    }
    .quick-scroll::-webkit-scrollbar { display: none; }
    .quick-chip {
      background: #27272a; border: 1px solid #3f3f46; color: #d4d4d8;
      font-size: 0.75rem; padding: 3px 9px; border-radius: 12px;
      white-space: nowrap; cursor: pointer; user-select: none;
      transition: transform 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }
    .quick-chip:active { background: #3f3f46; }
    .quick-chip.dragging {
      opacity: 0.6; transform: scale(1.08); border-color: #818cf8;
      background: #312e81; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .amount-wrap { display: flex; align-items: center; background: #09090b; border: 1px solid #3f3f46; border-radius: 10px; padding: 0 12px; }
    .currency { font-size: 1.5rem; font-weight: 700; color: #71717a; margin-right: 6px; }
    .amount-input { width: 100%; background: transparent; border: none; color: #fff; font-size: 2rem; font-weight: 700; padding: 10px 0; outline: none; }

    .section-label { font-size: 0.8rem; font-weight: 600; color: #a1a1aa; margin-bottom: 4px; }
    .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .btn-opt { 
      background: #09090b; border: 1px solid #27272a; color: #d4d4d8; 
      padding: 10px 4px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; 
      text-align: center; user-select: none; transition: all 0.15s ease;
    }

    .sub-box { background: #09090b; border: 1px dashed #3f3f46; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .chip-scroll { 
      position: relative;
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px;
      scrollbar-width: none; touch-action: pan-x; overscroll-behavior-x: contain;
    }
    .chip-scroll::-webkit-scrollbar { display: none; }
    .chip { 
      background: #18181b; border: 1px solid #3f3f46; color: #a1a1aa; 
      padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; 
      white-space: nowrap; transition: background 0.15s ease; flex-shrink: 0; 
    }

    .select-wrap { display: flex; flex-direction: column; gap: 6px; }
    .select-label { font-size: 0.75rem; color: #a1a1aa; font-weight: 500; }
    .select-input { 
      width: 100%; background: #18181b; border: 1px solid #3f3f46; color: #fff; 
      padding: 11px 12px; border-radius: 8px; font-size: 0.95rem; outline: none; 
      cursor: pointer;
    }
    .select-input:focus { border-color: #818cf8; }

    .submit-wrap { display: flex; gap: 8px; margin-top: 4px; }
    .btn-submit { flex: 1; background: #10b981; border: none; color: #fff; padding: 14px; border-radius: 10px; font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: background 0.2s ease; }
    .btn-submit.edit-mode { background: #6366f1; }
    .btn-submit:active { opacity: 0.85; }
    .btn-cancel-edit { background: #27272a; border: 1px solid #3f3f46; color: #d4d4d8; padding: 14px 16px; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; white-space: nowrap; }

    /* 第二頁：明細專屬樣式 */
    .history-card { background: #18181b; border: 1px solid #27272a; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-height: 520px; }
    .history-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.92rem; font-weight: 600; color: #a1a1aa; }
    .history-actions { display: flex; align-items: center; gap: 8px; }
    .btn-clear { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; padding: 4px 8px; border-radius: 6px; font-size: 0.72rem; cursor: pointer; }
    .btn-clear:hover { background: rgba(239, 68, 68, 0.2); }
    .swipe-tip { font-size: 0.72rem; color: #71717a; margin-top: -4px; }
    .history-list { display: flex; flex-direction: column; gap: 9px; max-height: calc(100vh - 200px); overflow-y: auto; overflow-x: hidden; }
    
    .history-item { 
      display: flex; flex-direction: column; gap: 6px;
      background: #09090b; padding: 11px 13px; border-radius: 10px; border: 1px solid #27272a;
      position: relative; touch-action: pan-y; user-select: none; cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
      border-left: 5px solid #71717a;
    }
    .history-item:active { background: #141417; }

    .item-header-row { display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
    .item-title-wrap { display: flex; align-items: center; gap: 8px; }
    .badge { 
      font-size: 0.8rem; font-weight: 700; padding: 2px 7px; 
      border-radius: 5px; border: 1px solid; letter-spacing: 0.5px;
    }
    .item-title { font-size: 1.02rem; font-weight: 700; color: #f4f4f5; }
    .item-date { font-size: 0.8rem; color: #a1a1aa; font-weight: 500; }

    .item-body-row { display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
    .method-highlight { 
      font-size: 0.9rem; font-weight: 600; padding: 2px 8px; 
      border-radius: 6px; background: rgba(255, 255, 255, 0.05); 
    }
    .item-amount { font-size: 1.25rem; font-weight: 800; color: #f87171; }

    .item-note-row { 
      font-size: 0.85rem; color: #e4e4e7; background: #18181b; 
      padding: 5px 9px; border-radius: 6px; border: 1px dashed #3f3f46; 
      line-height: 1.35; pointer-events: none; word-break: break-all;
    }

    /* 頂部微膠囊 Toast */
    .top-toast {
      position: fixed; top: 16px; left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: #18181b; border: 1.5px solid #10b981; color: #f4f4f5;
      padding: 8px 18px; border-radius: 30px; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8), 0 0 12px rgba(16, 185, 129, 0.3);
      font-size: 0.85rem; font-weight: 600; z-index: 9999;
      opacity: 0; pointer-events: none;
      transition: transform 0.28s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.25s ease;
    }
    .top-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
    .top-toast-icon { color: #10b981; font-weight: 800; font-size: 1rem; }

    /* 操作選單彈窗 */
    .action-sheet {
      background: #18181b; border: 1px solid #3f3f46; border-radius: 16px;
      width: 100%; max-width: 440px; padding: 16px; display: flex;
      flex-direction: column; gap: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }
    .action-sheet-title { font-size: 0.9rem; font-weight: 600; color: #a1a1aa; text-align: center; margin-bottom: 4px; }
    .action-btn {
      background: #27272a; border: 1px solid #3f3f46; color: #fff;
      padding: 12px; border-radius: 10px; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; text-align: center; transition: background 0.15s ease;
    }
    .action-btn:active { background: #3f3f46; }
    .action-btn.cancel { background: transparent; border: none; color: #71717a; margin-top: 2px; }

    /* 刪除復原 (Undo) 浮動提示列 */
    .undo-toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(90px);
      background: #27272a; border: 1px solid #3f3f46; color: #f4f4f5;
      padding: 9px 16px; border-radius: 30px; display: flex; align-items: center; gap: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7); font-size: 0.82rem; z-index: 1000;
      opacity: 0; pointer-events: none;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }
    .undo-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
    .btn-undo {
      background: #10b981; border: none; color: #fff; font-weight: 700;
      padding: 4px 10px; border-radius: 14px; font-size: 0.78rem; cursor: pointer;
    }
    .btn-undo:active { opacity: 0.85; }

    /* 設定彈窗樣式 */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; padding: 16px; z-index: 99; }
    .modal { background: #18181b; border: 1px solid #3f3f46; border-radius: 14px; width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .modal-header-row { display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 1.05rem; font-weight: 700; color: #fff; }
    .modal-version-tag { font-size: 0.75rem; background: #27272a; border: 1px solid #3f3f46; color: #a1a1aa; padding: 2px 8px; border-radius: 12px; font-weight: 600; }
    .modal-desc { font-size: 0.8rem; color: #a1a1aa; line-height: 1.4; }
    
    .color-picker-row { display: flex; justify-content: space-between; align-items: center; background: #09090b; padding: 8px 12px; border-radius: 8px; border: 1px solid #27272a; }
    .color-picker-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: #d4d4d8; }
    .color-picker-item input[type="color"] { -webkit-appearance: none; border: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; background: transparent; }
    .color-picker-item input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker-item input[type="color"]::-webkit-color-swatch { border: 1px solid #3f3f46; border-radius: 50%; }

    .config-tools-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }

    .modal textarea { 
      width: 100%; height: 220px; background: #09090b; border: 1px solid #3f3f46; 
      color: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 0.9rem; padding: 12px; 
      border-radius: 8px; outline: none; resize: none; line-height: 1.6;
    }
    .modal-btns { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
    .modal-footer-info { text-align: center; font-size: 0.72rem; color: #52525b; padding-top: 2px; }

    /* 回收桶樣式 */
    .trash-section { border-top: 1px solid #27272a; padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .trash-header { display: flex; justify-content: space-between; align-items: center; }
    .trash-title { font-size: 0.88rem; font-weight: 600; color: #f87171; display: flex; align-items: center; gap: 4px; }
    .trash-list { display: flex; flex-direction: column; gap: 6px; max-height: 140px; overflow-y: auto; }
    .trash-item { display: flex; justify-content: space-between; align-items: center; background: #09090b; padding: 8px 10px; border-radius: 6px; border: 1px solid #27272a; font-size: 0.8rem; }
    .trash-item-info { display: flex; flex-direction: column; gap: 2px; }
    .trash-restore-btn { background: #27272a; border: 1px solid #3f3f46; color: #34d399; padding: 3px 8px; border-radius: 4px; font-size: 0.72rem; cursor: pointer; }
    .trash-empty-msg { font-size: 0.78rem; color: #71717a; text-align: center; padding: 8px 0; }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>GengarTally</h1>
    <button type="button" class="btn-text" onclick="openConfigModal()">設定帳戶</button>
  </header>

  <div class="nav-tabs">
    <button type="button" id="tab-btn-0" class="tab-btn active" onclick="switchPage(0, 'right')">記帳</button>
    <button type="button" id="tab-btn-1" class="tab-btn" onclick="switchPage(1, 'left')">支出明細 (<span id="tab-count">0</span>)</button>
  </div>

  <!-- 第 1 頁：記帳輸入台 -->
  <div class="page-view active" id="page-entry">
    <div class="card">
      <div class="date-row">
        <input type="date" id="tx-date" class="date-input">
        <button type="button" class="btn-today" onclick="setToday()">今天</button>
      </div>

      <div class="item-group">
        <input type="text" id="tx-item" class="text-input" placeholder="支出項目">
        <div id="quick-items-scroll" class="quick-scroll"></div>
      </div>

      <div class="amount-wrap">
        <span class="currency">$</span>
        <input type="number" id="tx-amount" class="amount-input" placeholder="0" inputmode="decimal">
      </div>

      <div>
        <div class="section-label">付款方式</div>
        <div class="btn-grid">
          <button type="button" class="btn-opt" onclick="setMainMethod('mobile')">行動支付</button>
          <button type="button" class="btn-opt" onclick="setMainMethod('card')">信用卡</button>
          <button type="button" class="btn-opt" onclick="setMainMethod('bank')">銀行帳戶</button>
          <button type="button" class="btn-opt" onclick="setMainMethod('cash')">現金</button>
        </div>
      </div>

      <div id="sub-method-panel" class="sub-box"></div>

      <input type="text" id="tx-note" class="text-input" placeholder="備註">

      <div class="submit-wrap">
        <button type="button" id="btn-submit" class="btn-submit" onclick="submitRecord()">新增支出</button>
        <button type="button" id="btn-cancel-edit" class="btn-cancel-edit" style="display:none;" onclick="cancelEdit()">取消修改</button>
      </div>
    </div>
  </div>

  <!-- 第 2 頁：全螢幕支出明細清單 -->
  <div class="page-view" id="page-history">
    <div class="history-card">
      <div class="history-header">
        <span>近期支出明細</span>
        <div class="history-actions">
          <span id="history-total">合計: $0</span>
          <button type="button" class="btn-clear" onclick="clearAllRecords()">清空紀錄</button>
        </div>
      </div>
      <div class="swipe-tip">點擊可「編輯/複製」，向左滑動直接刪除，向右滑切回記帳</div>
      <div id="history-list" class="history-list"></div>
    </div>
  </div>

</div>

<!-- 頂部微膠囊 Toast 提示 -->
<div id="top-toast" class="top-toast">
  <span class="top-toast-icon">✓</span>
  <span id="top-toast-msg">已記錄：711 $60</span>
</div>

<!-- 紀錄操作彈窗 (編輯 / 複製) -->
<div id="action-modal" class="modal-backdrop">
  <div class="action-sheet" onclick="event.stopPropagation()">
    <div class="action-sheet-title" id="action-sheet-title">紀錄操作</div>
    <button type="button" class="action-btn" onclick="triggerEditRecord()">✏️ 編輯修改此紀錄</button>
    <button type="button" class="action-btn onclick="triggerCopyRecord()">📋 複製帶入再記一筆</button>
    <button type="button" class="action-btn cancel" onclick="closeActionModal()">取消</button>
  </div>
</div>

<!-- 刪除復原 (Undo) 浮動提示 -->
<div id="undo-toast" class="undo-toast">
  <span id="undo-msg">已刪除紀錄</span>
  <button type="button" class="btn-undo" onclick="undoLastDelete()">復原</button>
</div>

<!-- 設定彈窗 (含版本號標記) -->
<div id="config-modal" class="modal-backdrop">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header-row">
      <div class="modal-title">快速設定帳戶</div>
      <span class="modal-version-tag">v1.0</span>
    </div>
    <div class="modal-desc">可直接挑選類別顏色；或在文本手動設定常用標籤（最多10個）：</div>
    
    <div class="color-picker-row">
      <label class="color-picker-item">
        <input type="color" id="picker-mobile" onchange="syncPickerToText('mobile', this.value)">
        <span>行動支付</span>
      </label>
      <label class="color-picker-item">
        <input type="color" id="picker-card" onchange="syncPickerToText('card', this.value)">
        <span>信用卡</span>
      </label>
      <label class="color-picker-item">
        <input type="color" id="picker-bank" onchange="syncPickerToText('bank', this.value)">
        <span>帳戶</span>
      </label>
      <label class="color-picker-item">
        <input type="color" id="picker-cash" onchange="syncPickerToText('cash', this.value)">
        <span>現金</span>
      </label>
    </div>

    <!-- 備份工具列 -->
    <div class="config-tools-row">
      <span style="font-size:0.8rem; color:#a1a1aa;">文檔備份：</span>
      <div style="display:flex; gap:5px;">
        <button type="button" class="btn-text" style="padding:4px 8px; font-size:0.75rem;" onclick="copyConfigToClipboard()">📋 複製</button>
        <button type="button" class="btn-text" style="padding:4px 8px; font-size:0.75rem;" onclick="downloadConfigFile()">💾 下載</button>
        <button type="button" class="btn-text" style="padding:4px 8px; font-size:0.75rem;" onclick="shareConfigFile()">📤 分享</button>
        <button type="button" class="btn-text" style="padding:4px 8px; font-size:0.75rem;" onclick="triggerImportConfig()">📥 匯入</button>
        <input type="file" id="config-file-input" accept=".txt,text/plain" style="display:none;" onchange="handleImportConfigFile(event)">
      </div>
    </div>

    <textarea id="config-text" placeholder="讀取中..."></textarea>
    
    <div class="modal-btns">
      <button type="button" class="btn-text" style="color:#ef4444;" onclick="resetDefaultConfig()">還原預設</button>
      <div style="display:flex; gap:8px;">
        <button type="button" class="btn-text" onclick="closeConfigModal()">關閉</button>
        <button type="button" class="btn-submit" style="padding:8px 16px; font-size:0.85rem;" onclick="saveConfigText()">儲存變更</button>
      </div>
    </div>

    <div class="trash-section">
      <div class="trash-header">
        <span class="trash-title">🗑️ 回收桶</span>
        <button type="button" class="btn-clear" onclick="emptyTrash()">永久清空</button>
      </div>
      <div id="trash-list" class="trash-list"></div>
    </div>

    <div class="modal-footer-info">GengarTally v1.0.0 (離線版)</div>
  </div>
</div>

<script>
  const DEFAULT_CONFIG = {
    colors: {
      mobile: "#ff0000",
      card: "#00ffff",
      bank: "#ffff00",
      cash: "#00ff00"
    },
    quick_items: ["711", "蝦皮", "吃飯", "加油"],

  // 亮度計算對比色輔助函式（淺色底回傳黑字，深色底回傳白字）
  function getContrastColor(hex) {
    const c = (hex || '#ffffff').replace('#', '');
    let r = 255, g = 255, b = 255;
    if (c.length === 3) {
      r = parseInt(c[0] + c[0], 16);
      g = parseInt(c[1] + c[1], 16);
      b = parseInt(c[2] + c[2], 16);
    } else if (c.length >= 6) {
      r = parseInt(c.substr(0, 2), 16);
      g = parseInt(c.substr(2, 2), 16);
      b = parseInt(c.substr(4, 2), 16);
    }
    const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
    return (yiq >= 140) ? '#09090b' : '#ffffff';
  }

  function init() {
    setToday();
    renderQuickItems();

    window.addEventListener('popstate', (e) => {

      if (cfgModal && cfgModal.style.display === 'flex') {

  function switchPage(pageIdx, animDir = 'left') {
    currentPage = pageIdx;
    const pEntry = document.getElementById('page-entry');
    const pHistory = document.getElementById('page-history');
    
    if (pageIdx === 0) {
      pHistory.style.display = 'none';
      pHistory.classList.remove('active', 'slide-left', 'slide-right');
      
      pEntry.style.display = 'flex';
      pEntry.classList.remove('slide-left', 'slide-right');
      pEntry.classList.add(animDir === 'right' ? 'slide-right' : 'slide-left');
    } else {
      pEntry.style.display = 'none';
      pEntry.classList.remove('active', 'slide-left', 'slide-right');
      
      pHistory.style.display = 'flex';
      pHistory.classList.remove('slide-left', 'slide-right');
      pHistory.classList.add(animDir === 'left' ? 'slide-left' : 'slide-right');
    }

    document.getElementById('tab-btn-0').classList.toggle('active', pageIdx === 0);
    document.getElementById('tab-btn-1').classList.toggle('active', pageIdx === 1);
    
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  function initScreenSwipe() {
    let startX = 0, startY = 0, isSwipeActive = false;

    document.addEventListener('touchstart', (e) => {
      if (e.target.closest('#config-modal') ||
          e.target.closest('#action-modal') ||
          e.target.closest('.chip-scroll') ||
          e.target.closest('.quick-scroll')) {
        isSwipeActive = false;
        return;
      }
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      isSwipeActive = true;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      if (!isSwipeActive) return;
      isSwipeActive = false;
      const endX = e.changedTouches[0].clientX;
      const endY = e.changedTouches[0].clientY;
      const diffX = endX - startX;
      const diffY = endY - startY;

      if (Math.abs(diffX) > 45 && Math.abs(diffX) > Math.abs(diffY) * 1.2) {
        if (diffX < 0 && currentPage === 0) {
          switchPage(1, 'left');
        } else if (diffX > 0 && currentPage === 1) {
          switchPage(0, 'right');
        }
      }
    }, { passive: true });
  }

  function showTopToast(text) {
    const toast = document.getElementById('top-toast');
    const msg = document.getElementById('top-toast-msg');
    if (!toast || !msg) return;

    msg.innerText = text;
    toast.classList.add('show');

    clearTimeout(topToastTimeout);
    topToastTimeout = setTimeout(() => {
      toast.classList.remove('show');
    }, 2200);
  }

  function setToday() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const input = document.getElementById('tx-date');
    if (input) input.value = `${y}-${m}-${d}`;
  }

  function renderQuickItems() {
    const container = document.getElementById('quick-items-scroll');
    if (!container) return;
    container.innerHTML = '';

    const items = config.quick_items || [];
    if (!items.length) {
      container.style.display = 'none';
      return;
    }
    container.style.display = 'flex';

    items.forEach((itemText, idx) => {
      const chip = document.createElement('div');
      chip.className = 'quick-chip';
      chip.innerText = itemText;
      chip.draggable = true;
      chip.dataset.index = idx;

      chip.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', idx);
        chip.classList.add('dragging');
      });
      chip.addEventListener('dragend', () => chip.classList.remove('dragging'));
      chip.addEventListener('dragover', (e) => e.preventDefault());
      chip.addEventListener('drop', (e) => {
        e.preventDefault();
        const fromIdx = parseInt(e.dataTransfer.getData('text/plain'), 10);
        if (fromIdx !== idx) reorderQuickItem(fromIdx, idx);
      });

      let holdTimer = null;
      let isDragging = false;
      let startX = 0, startY = 0;

      chip.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        isDragging = false;
        holdTimer = setTimeout(() => {
          isDragging = true;
          chip.classList.add('dragging');
          if (navigator.vibrate) navigator.vibrate(30);
        }, 260);
      }, { passive: true });

      chip.addEventListener('touchmove', (e) => {
        const diffX = Math.abs(e.touches[0].clientX - startX);
        const diffY = Math.abs(e.touches[0].clientY - startY);
        if (!isDragging && (diffX > 8 || diffY > 8)) clearTimeout(holdTimer);
        if (isDragging) {
          e.preventDefault();
          const targetElem = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
          const targetChip = targetElem ? targetElem.closest('.quick-chip') : null;
          if (targetChip && targetChip !== chip) {
            reorderQuickItem(idx, parseInt(targetChip.dataset.index, 10));
          }
        }
      }, { passive: false });

      chip.addEventListener('touchend', () => {
        clearTimeout(holdTimer);
        if (isDragging) {
          isDragging = false;
          chip.classList.remove('dragging');
        } else {
          selectQuickItem(itemText);
        }
      });

      chip.addEventListener('click', () => {
        if (!chip.classList.contains('dragging')) selectQuickItem(itemText);
      });

      container.appendChild(chip);
    });
  }

  function reorderQuickItem(fromIdx, toIdx) {
    if (fromIdx === toIdx || fromIdx < 0 || toIdx < 0) return;
    const moved = config.quick_items.splice(fromIdx, 1)[0];
    config.quick_items.splice(toIdx, 0, moved);
    localStorage.setItem('expense_config', JSON.stringify(config));
    renderQuickItems();
  }

  }

  // --- 動態渲染主要付款方式按鈕顏色 ---

    const methods = ['mobile', 'card', 'bank', 'cash'];

        btn.style.borderColor = col;
        btn.style.color = getContrastColor(col);
        btn.style.fontWeight = '700';
        btn.style.boxShadow = `0 2px 10px ${col}44`;
      } else {
        btn.classList.remove('active');
        btn.style.backgroundColor = '#09090b';
        btn.style.borderColor = '#27272a';
        btn.style.color = '#d4d4d8';
        btn.style.fontWeight = 'normal';
        btn.style.boxShadow = 'none';

  // --- 子付款方式 (原位更新，且子選項亦呼應類別顏色) ---
  function renderSubMethods() {
    const panel = document.getElementById('sub-method-panel');
    if (!panel) return;
    
    if (curMethod === 'cash') {
      panel.style.display = 'none';
      panel.innerHTML = '';

    panel.style.display = 'flex';

    const curTypeColor = colors[curMethod] || '#6366f1';

    if (curMethod === 'mobile') {
      const platforms = config.mobile_platforms || [];
      if (!platforms.length) {
        panel.innerHTML = '<div style="color:#71717a;font-size:0.8rem;">尚未設定行動支付平台</div>';
        return;

      if (!curPlatform || !platforms.some(p => p.name === curPlatform)) {

      }

      let platformRow = panel.querySelector('.chip-scroll');
      if (!platformRow) {
        platformRow = document.createElement('div');
        platformRow.className = 'chip-scroll';

          chip.className = 'chip';

          chip.onclick = (e) => { 
            e.preventDefault();

        chip.classList.toggle('active', isActive);

          chip.style.backgroundColor = curTypeColor;
          chip.style.borderColor = curTypeColor;
          chip.style.color = contrastText;
          chip.style.fontWeight = '700';
        } else {
          chip.style.backgroundColor = '#18181b';
          chip.style.borderColor = '#3f3f46';
          chip.style.color = '#a1a1aa';
          chip.style.fontWeight = 'normal';
        }
      });

      renderPlatformCardSelect();
    } else if (curMethod === 'card') {
      panel.innerHTML = '';
      const cards = config.direct_cards || [];
      if (!cards.length) {
        panel.innerHTML = '<div style="color:#71717a;font-size:0.8rem;">尚未設定信用卡</div>';
        return;
      }
      if (!curCard || !cards.includes(curCard)) curCard = cards[0];

      selectWrap.className = 'select-wrap';
      selectWrap.innerHTML = `<span class="select-label">選擇信用卡：</span>`;

      const select = document.createElement('select');
      select.className = 'select-input';
      cards.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.innerText = c;
        if (c === curCard) opt.selected = true;
        select.appendChild(opt);
      });
      select.onchange = (e) => { curCard = e.target.value; };
      selectWrap.appendChild(select);
      panel.appendChild(selectWrap);
    } else if (curMethod === 'bank') {
      panel.innerHTML = '';
      const accounts = config.bank_accounts || [];
      if (!accounts.length) {
        panel.innerHTML = '<div style="color:#71717a;font-size:0.8rem;">尚未設定帳戶</div>';
        return;
      }
      if (!curCard || !accounts.includes(curCard)) curCard = accounts[0];
      const selectWrap = document.createElement('div');
      selectWrap.className = 'select-wrap';
      selectWrap.innerHTML = `<span class="select-label">選擇扣款帳戶：</span>`;

      const select = document.createElement('select');
      select.className = 'select-input';
      accounts.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b;
        opt.innerText = b;
        if (b === curCard) opt.selected = true;
        select.appendChild(opt);
      });
      select.onchange = (e) => { curCard = e.target.value; };
      selectWrap.appendChild(select);
      panel.appendChild(selectWrap);
    }

  function selectMobilePlatform(pName) {
    curPlatform = pName;
    curCard = '';
    const panel = document.getElementById('sub-method-panel');
    if (!panel) return;
    const platformRow = panel.querySelector('.chip-scroll');

          chip.style.borderColor = curTypeColor;

  function renderPlatformCardSelect() {
    const panel = document.getElementById('sub-method-panel');
    if (!panel) return;
    
    let selectWrap = panel.querySelector('.select-wrap');
    if (selectWrap) selectWrap.remove();

    const platforms = config.mobile_platforms || [];
    const activePlatform = platforms.find(p => p.name === curPlatform);
    const cards = (activePlatform && activePlatform.cards) ? activePlatform.cards : [];
    if (cards.length) {
      if (!curCard || !cards.includes(curCard)) curCard = cards[0];
      selectWrap = document.createElement('div');
      selectWrap.className = 'select-wrap';
      selectWrap.innerHTML = `<span class="select-label">選擇扣款卡片 / 帳戶：</span>`;

      const select = document.createElement('select');
      select.className = 'select-input';
      cards.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.innerText = c;
        if (c === curCard) opt.selected = true;
        select.appendChild(opt);
      });
      select.onchange = (e) => { curCard = e.target.value; };
      selectWrap.appendChild(select);
      panel.appendChild(selectWrap);
    }
  }

  function submitRecord() {
    const itemInput = document.getElementById('tx-item');
    const itemVal = itemInput.value.trim();

    if (!itemVal) {
      alert('請填寫支出項目！');
      itemInput.focus();
      return;
    }

    const amountInput = document.getElementById('tx-amount');
    const amountVal = parseFloat(amountInput.value);
    if (!amountVal || isNaN(amountVal) || amountVal <= 0) {
      alert('請輸入有效金額');
      amountInput.focus();
      return;
    }

    const dateInput = document.getElementById('tx-date');
    const dateVal = dateInput.value || '2026-11-10';
    const noteInput = document.getElementById('tx-note');
    const noteVal = noteInput.value.trim();

    let payDetail = '現金';
    if (curMethod === 'mobile') {
      payDetail = `${curPlatform}${curCard ? ' · ' + curCard : ''}`;
    } else if (curMethod === 'card') {
      payDetail = curCard;
    } else if (curMethod === 'bank') {
      payDetail = curCard;
    }

    if (editingRecordId !== null) {
      const targetIndex = records.findIndex(r => r.id === editingRecordId);
      if (targetIndex !== -1) {
        records[targetIndex] = {
          id: editingRecordId,
          item: itemVal,
          date: dateVal,
          amount: amountVal,
          note: noteVal,
          methodType: curMethod,
          methodDetail: payDetail
        };
      }
      cancelEdit();
      showTopToast(`已更新：${itemVal} $${amountVal.toLocaleString()}`);
    } else {
      records.unshift({
        id: Date.now(),
        item: itemVal,
        date: dateVal,
        amount: amountVal,
        note: noteVal,
        methodType: curMethod,
        methodDetail: payDetail
      });
      if (navigator.vibrate) navigator.vibrate(35);
      showTopToast(`已記錄：${itemVal} $${amountVal.toLocaleString()}`);
    }

    records.sort((a, b) => new Date(b.date) - new Date(a.date));
    localStorage.setItem('expense_records', JSON.stringify(records));
    
    itemInput.value = '';
    amountInput.value = '';
    noteInput.value = '';
    renderHistory();
  }

  function cancelEdit() {
    editingRecordId = null;
    const submitBtn = document.getElementById('btn-submit');
    submitBtn.innerText = '新增支出';
    submitBtn.classList.remove('edit-mode');
    document.getElementById('btn-cancel-edit').style.display = 'none';

    document.getElementById('tx-item').value = '';
    document.getElementById('tx-amount').value = '';
    document.getElementById('tx-note').value = '';
    setToday();
  }

  function hexToRgba(hex, alpha) {
    let c = (hex || '#71717a').replace('#', '');
    if (c.length === 3) c = c.split('').map(x => x + x).join('');
    const num = parseInt(c, 16);
    return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
  }

  function renderHistory() {
    const list = document.getElementById('history-list');
    const tabCount = document.getElementById('tab-count');
    if (tabCount) tabCount.innerText = records.length;
    if (!list) return;
    list.innerHTML = '';
    let total = 0;

    const colors = config.colors || DEFAULT_CONFIG.colors;

    records.forEach(r => {
      total += r.amount;
      const type = r.methodType || 'mobile';
      const itemColor = colors[type] || '#71717a';
      const badgeBg = hexToRgba(itemColor, 0.18);
      
      const item = document.createElement('div');
      item.className = 'history-item';
      item.style.borderLeftColor = itemColor;
      
      let typeText = '行動支付';
      if (type === 'card') typeText = '信用卡';
      else if (type === 'bank') typeText = '帳戶';
      else if (type === 'cash') typeText = '現金';

      const noteHtml = r.note ? `<div class="item-note-row">💬 ${escapeHtml(r.note)}</div>` : '';

      item.innerHTML = `
        <div class="item-header-row">
          <div class="item-title-wrap">
            <span class="badge" style="background:${badgeBg}; color:${itemColor}; border-color:${itemColor}88;">${typeText}</span>
            <span class="item-title">${escapeHtml(r.item)}</span>
          </div>
          <span class="item-date">${r.date}</span>
        </div>
        <div class="item-body-row">
          <div class="method-highlight" style="color:${itemColor}; border:1px solid ${itemColor}44;">
            ${escapeHtml(r.methodDetail)}
          </div>
          <div class="item-amount">$${r.amount.toLocaleString()}</div>
        </div>
        ${noteHtml}
      `;

      let startX = 0, startY = 0, isDragging = false, currentDiffX = 0, hasMoved = false;
      
      const onStart = (clientX, clientY) => {
        startX = clientX;
        startY = clientY;
        isDragging = true;
        hasMoved = false;
        currentDiffX = 0;
        item.style.transition = 'none';
      };

      const onMove = (clientX, clientY) => {
        if (!isDragging) return;
        const diffX = clientX - startX;
        const diffY = clientY - startY;

        if (Math.abs(diffX) > 8 || Math.abs(diffY) > 8) hasMoved = true;

        if (diffX < 0 && Math.abs(diffX) > Math.abs(diffY)) {
          currentDiffX = diffX;
          item.style.transform = `translateX(${diffX}px)`;
          item.style.opacity = Math.max(0.1, 1 - Math.abs(diffX) / 220);
        }
      };

      const onEnd = (clientX, clientY) => {
        if (!isDragging) return;
        isDragging = false;
        const diffX = clientX !== undefined ? (clientX - startX) : currentDiffX;
        
        if (diffX > 75 && Math.abs(diffX) > Math.abs(clientY - startY)) {
          switchPage(0, 'right');
          return;
        }

        item.style.transition = 'transform 0.22s ease, opacity 0.22s ease';
        if (currentDiffX < -80) {
          item.style.transform = 'translateX(-110%)';
          item.style.opacity = '0';
          setTimeout(() => { moveToTrash(r.id); }, 200);
        } else {
          item.style.transform = 'translateX(0)';
          item.style.opacity = '1';
        }
      };

      item.addEventListener('touchstart', (e) => onStart(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
      item.addEventListener('touchmove', (e) => onMove(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
      item.addEventListener('touchend', (e) => onEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY));

      item.addEventListener('mousedown', (e) => {
        onStart(e.clientX, e.clientY);
        const onMouseMove = (ev) => onMove(ev.clientX, ev.clientY);
        const onMouseUp = (ev) => {
          onEnd(ev.clientX, ev.clientY);
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
        };
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
      });

      item.addEventListener('click', () => {
        if (!hasMoved && Math.abs(currentDiffX) < 8) {
          openActionModal(r);
        }
      });

      list.appendChild(item);
    });

    const totalEl = document.getElementById('history-total');
    if (totalEl) totalEl.innerText = `合計: $${total.toLocaleString()}`;
  }

  function openActionModal(record) {
    activeSelectedRecord = record;
    const title = document.getElementById('action-sheet-title');
    if (title) title.innerText = `${record.item} · $${record.amount.toLocaleString()}`;

    history.pushState({ actionModalOpen: true }, '');
    document.getElementById('action-modal').style.display = 'flex';
  }

  function closeActionModal() {
    const modal = document.getElementById('action-modal');
    if (modal && modal.style.display === 'flex') {
      modal.style.display = 'none';
      activeSelectedRecord = null;
      if (history.state && history.state.actionModalOpen) {
        history.back();
      }
    }
  }

  function triggerEditRecord() {
    if (!activeSelectedRecord) return;
    loadRecordIntoForm(activeSelectedRecord, true);
    closeActionModal();
    switchPage(0, 'right');
  }

  function triggerCopyRecord() {
    if (!activeSelectedRecord) return;
    loadRecordIntoForm(activeSelectedRecord, false);
    closeActionModal();
    switchPage(0, 'right');
  }

  function loadRecordIntoForm(r, isEdit) {
    const itemInput = document.getElementById('tx-item');
    const amountInput = document.getElementById('tx-amount');
    const dateInput = document.getElementById('tx-date');
    const noteInput = document.getElementById('tx-note');

    itemInput.value = r.item || '';
    amountInput.value = r.amount || '';
    noteInput.value = r.note || '';

    if (isEdit) {
      dateInput.value = r.date || '';
      editingRecordId = r.id;
      const submitBtn = document.getElementById('btn-submit');
      submitBtn.innerText = '儲存修改';
      submitBtn.classList.add('edit-mode');
      document.getElementById('btn-cancel-edit').style.display = 'block';
    } else {
      setToday();
      editingRecordId = null;
      const submitBtn = document.getElementById('btn-submit');
      submitBtn.innerText = '新增支出';
      submitBtn.classList.remove('edit-mode');
      document.getElementById('btn-cancel-edit').style.display = 'none';
    }

    const type = r.methodType || 'mobile';
    setMainMethod(type);

    if (type === 'mobile') {
      const parts = (r.methodDetail || '').split(' · ');
      curPlatform = parts[0] || '';
      curCard = parts[1] || '';
      renderSubMethods();
    } else if (type === 'card' || type === 'bank') {
      curCard = r.methodDetail || '';
      renderSubMethods();
    }

    amountInput.focus();
  }

  function moveToTrash(id) {
    const target = records.find(r => r.id === id);
    if (!target) return;
    
    const trashedItem = { ...target, deletedAt: new Date().toLocaleString() };
    trashRecords.unshift(trashedItem);
    records = records.filter(r => r.id !== id);

    if (editingRecordId === id) cancelEdit();
    
    localStorage.setItem('expense_records', JSON.stringify(records));
    localStorage.setItem('expense_trash', JSON.stringify(trashRecords));
    renderHistory();

    showUndoToast(trashedItem);
  }

  function showUndoToast(record) {
    lastDeletedRecord = record;
    const toast = document.getElementById('undo-toast');
    const msg = document.getElementById('undo-msg');
    if (!toast || !msg) return;

    msg.innerText = `已刪除：${record.item} · $${record.amount.toLocaleString()}`;
    toast.classList.add('show');

    clearTimeout(undoTimeout);
    undoTimeout = setTimeout(() => {
      toast.classList.remove('show');
      lastDeletedRecord = null;
    }, 3500);
  }

  function undoLastDelete() {
    if (!lastDeletedRecord) return;
    const toast = document.getElementById('undo-toast');
    if (toast) toast.classList.remove('show');
    clearTimeout(undoTimeout);

    trashRecords = trashRecords.filter(t => t.id !== lastDeletedRecord.id);
    const { deletedAt, ...restored } = lastDeletedRecord;
    records.unshift(restored);
    records.sort((a, b) => new Date(b.date) - new Date(a.date));

    localStorage.setItem('expense_records', JSON.stringify(records));
    localStorage.setItem('expense_trash', JSON.stringify(trashRecords));

    lastDeletedRecord = null;
    renderHistory();
  }

  function clearAllRecords() {
    if (!records.length) {
      alert('目前沒有任何紀錄！');
      return;
    }
    if (confirm('確定要清空所有支出紀錄嗎？紀錄將移至「設定帳戶」內的回收桶。')) {
      const nowStr = new Date().toLocaleString();
      const moved = records.map(r => ({ ...r, deletedAt: nowStr }));
      trashRecords = [...moved, ...trashRecords];
      records = [];
      cancelEdit();
      
      localStorage.setItem('expense_records', JSON.stringify(records));
      localStorage.setItem('expense_trash', JSON.stringify(trashRecords));
      renderHistory();
    }
  }

  function renderTrashList() {
    const trashListEl = document.getElementById('trash-list');
    if (!trashListEl) return;
    trashListEl.innerHTML = '';

    if (!trashRecords.length) {
      trashListEl.innerHTML = '<div class="trash-empty-msg">回收桶空空如也</div>';
      return;
    }

    trashRecords.forEach(tr => {
      const item = document.createElement('div');
      item.className = 'trash-item';
      item.innerHTML = `
        <div class="trash-item-info">
          <div style="font-weight:600; color:#f4f4f5;">${escapeHtml(tr.item)} · $${tr.amount.toLocaleString()}</div>
          <div style="font-size:0.7rem; color:#71717a;">${tr.date} · ${escapeHtml(tr.methodDetail)}</div>
        </div>
        <button type="button" class="trash-restore-btn" onclick="restoreFromTrash(${tr.id})">還原</button>
      `;
      trashListEl.appendChild(item);
    });
  }

  function restoreFromTrash(id) {
    const target = trashRecords.find(t => t.id === id);
    if (!target) return;
    
    trashRecords = trashRecords.filter(t => t.id !== id);
    const { deletedAt, ...restoredRecord } = target;
    records.unshift(restoredRecord);
    records.sort((a, b) => new Date(b.date) - new Date(a.date));

    localStorage.setItem('expense_records', JSON.stringify(records));
    localStorage.setItem('expense_trash', JSON.stringify(trashRecords));
    
    renderHistory();
    renderTrashList();
  }

  function emptyTrash() {
    if (!trashRecords.length) {
      alert('回收桶已經是空的！');
      return;
    }
    if (confirm('確定要永久清空回收桶嗎？清空後將無法還原！')) {
      trashRecords = [];
      localStorage.setItem('expense_trash', JSON.stringify(trashRecords));
      renderTrashList();
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
  }

  function configToText(cfg) {
    const c = cfg.colors || DEFAULT_CONFIG.colors;
    let lines = ['[類別顏色]'];
    lines.push(`行動支付: ${c.mobile || '#ff0000'}`);
    lines.push(`信用卡: ${c.card || '#00ffff'}`);
    lines.push(`帳戶: ${c.bank || '#ffff00'}`);
    lines.push(`現金: ${c.cash || '#00ff00'}`);

    lines.push('\n[常用項目]');
    (cfg.quick_items || []).forEach(item => lines.push(item));

    lines.push('\n[行動支付]');
    (cfg.mobile_platforms || []).forEach(p => {
      lines.push(`${p.name}:`);
      (p.cards || []).forEach(card => lines.push(card));
    });

    lines.push('\n[信用卡]');
    (cfg.direct_cards || []).forEach(card => lines.push(card));

    lines.push('\n[帳戶]');
    (cfg.bank_accounts || []).forEach(b => lines.push(b));

    return lines.join('\n');
  }

  function textToConfig(text) {
    const rawLines = text.split('\n').map(l => l.trim());
    let section = '';
    let curPlatformObj = null;
    const newCfg = { 
      colors: { ...DEFAULT_CONFIG.colors },
      quick_items: [],
      mobile_platforms: [], 
      direct_cards: [], 
      bank_accounts: [] 
    };

    for (let line of rawLines) {
      if (!line) continue;
      
      if (line.includes('[類別顏色]')) { section = 'color'; continue; }
      if (line.includes('[常用項目]')) { section = 'quick'; curPlatformObj = null; continue; }
      if (line.includes('[行動支付]')) { section = 'mobile'; curPlatformObj = null; continue; }
      if (line.includes('[信用卡]') || line.includes('[常用信用卡]')) { section = 'card'; curPlatformObj = null; continue; }
      if (line.includes('[帳戶]') || line.includes('[常用帳戶]')) { section = 'bank'; curPlatformObj = null; continue; }

      if (section === 'color') {
        const parts = line.split(/[:：]/);
        if (parts.length >= 2) {
          const key = parts[0].trim();
          const val = parts[1].trim();
          if (key.includes('現金')) newCfg.colors.cash = val;
          else if (key.includes('行動支付')) newCfg.colors.mobile = val;
          else if (key.includes('信用卡')) newCfg.colors.card = val;
          else if (key.includes('帳戶')) newCfg.colors.bank = val;
        }
      } else if (section === 'quick') {
        if (newCfg.quick_items.length < 10) newCfg.quick_items.push(line);
      } else if (section === 'mobile') {
        if (line.endsWith(':') || line.endsWith('：')) {
          const pName = line.replace(/[:：]$/, '').trim();
          curPlatformObj = { name: pName, cards: [] };
          newCfg.mobile_platforms.push(curPlatformObj);
        } else if (line.includes(':') || line.includes('：')) {
          const parts = line.split(/[:：]/);
          const pName = parts[0].trim();
          const rem = parts.slice(1).join(':').trim();
          curPlatformObj = { name: pName, cards: [] };
          newCfg.mobile_platforms.push(curPlatformObj);
          if (rem) curPlatformObj.cards.push(rem);
        } else {
          if (curPlatformObj) {
            curPlatformObj.cards.push(line);
          }
        }
      } else if (section === 'card') {
        newCfg.direct_cards.push(line);
      } else if (section === 'bank') {
        newCfg.bank_accounts.push(line);
      }
    }
    return newCfg;
  }

  function openConfigModal() {
    const c = config.colors || DEFAULT_CONFIG.colors;
    document.getElementById('picker-mobile').value = c.mobile || '#ff0000';
    document.getElementById('picker-card').value = c.card || '#00ffff';
    document.getElementById('picker-bank').value = c.bank || '#ffff00';
    document.getElementById('picker-cash').value = c.cash || '#00ff00';

    document.getElementById('config-text').value = configToText(config);
    renderTrashList();
    
    history.pushState({ modalOpen: true }, '');
    document.getElementById('config-modal').style.display = 'flex';
  }

  function closeConfigModal() {
    const modal = document.getElementById('config-modal');
    if (modal && modal.style.display === 'flex') {
      modal.style.display = 'none';
      if (history.state && history.state.modalOpen) {
        history.back();
      }
    }
  }

  function syncPickerToText(type, hex) {
    const textEl = document.getElementById('config-text');
    let currentCfg = textToConfig(textEl.value);
    currentCfg.colors[type] = hex;
    textEl.value = configToText(currentCfg);
  }

  function saveConfigText() {
    const rawText = document.getElementById('config-text').value;
    const newConfig = textToConfig(rawText);
    if (!newConfig.mobile_platforms.length && !newConfig.direct_cards.length && !newConfig.bank_accounts.length) {
      alert('請至少填寫一項卡片或支付平台！');
      return;
    }
    config = newConfig;
    localStorage.setItem('expense_config', JSON.stringify(config));
    closeConfigModal();
    curPlatform = '';
    curCard = '';
    updateMainMethodStyles();
    renderQuickItems();
    renderSubMethods();
    renderHistory();
    alert('設定已儲存更新！');
  }

  function resetDefaultConfig() {
    if (confirm('確定要將帳戶與顏色設定還原回預設值嗎？')) {
      config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
      localStorage.setItem('expense_config', JSON.stringify(config));
      document.getElementById('config-text').value = configToText(config);
      
      document.getElementById('picker-mobile').value = DEFAULT_CONFIG.colors.mobile;
      document.getElementById('picker-card').value = DEFAULT_CONFIG.colors.card;
      document.getElementById('picker-bank').value = DEFAULT_CONFIG.colors.bank;
      document.getElementById('picker-cash').value = DEFAULT_CONFIG.colors.cash;
      
      updateMainMethodStyles();
      renderQuickItems();
      renderSubMethods();
      renderHistory();
    }
  }

  function downloadConfigFile() {
    const text = document.getElementById('config-text').value || configToText(config);
    const now = new Date();
    const dateStr = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
    const filename = `GengarTally_Config_${dateStr}.txt`;

    if (window.AndroidBridge && typeof window.AndroidBridge.downloadTextFile === 'function') {
      window.AndroidBridge.downloadTextFile(filename, text);
      return;
    }

    try {
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (e) {
      alert('下載失敗，建議改用「📋 複製」保存。');
    }
  }

  function shareConfigFile() {
    const text = document.getElementById('config-text').value || configToText(config);

    if (window.AndroidBridge && typeof window.AndroidBridge.shareText === 'function') {
      window.AndroidBridge.shareText('GengarTally 設定備份', text);
      return;
    }

    if (navigator.share) {
      navigator.share({
        title: 'GengarTally 設定備份',
        text: text
      }).catch(() => {});
    } else {
      copyConfigToClipboard();
    }
  }

  function copyConfigToClipboard() {
    const text = document.getElementById('config-text').value || configToText(config);
    
    const dummy = document.createElement('textarea');
    dummy.value = text;
    dummy.setAttribute('readonly', '');
    dummy.style.position = 'fixed';
    dummy.style.top = '0';
    dummy.style.left = '-9999px';
    dummy.style.opacity = '0';
    document.body.appendChild(dummy);

    dummy.focus();
    dummy.select();
    dummy.setSelectionRange(0, dummy.value.length);

    let copySucceeded = false;
    try {
      copySucceeded = document.execCommand('copy');
    } catch (e) {
      copySucceeded = false;
    }
    document.body.removeChild(dummy);

    if (copySucceeded) {
      alert('✓ 設定文檔已成功複製到剪貼簿！');
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        alert('✓ 設定文檔已複製到剪貼簿！');
      }).catch(() => {
        alert('請手動長按下方文字框進行選取複製。');
      });
    } else {
      alert('請手動長按下方文字框進行選取複製。');
    }
  }

  function triggerImportConfig() {
    const input = document.getElementById('config-file-input');
    if (input) {
      input.value = '';
      input.click();
    }
  }

  function handleImportConfigFile(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const textContent = e.target.result;
        const parsed = textToConfig(textContent);
        
        if (!parsed.mobile_platforms.length && !parsed.direct_cards.length && !parsed.bank_accounts.length) {
          alert('匯入失敗：檔案格式不正確或內容為空！');
          return;
        }

        config = parsed;
        localStorage.setItem('expense_config', JSON.stringify(config));
        document.getElementById('config-text').value = configToText(config);

        const c = config.colors || DEFAULT_CONFIG.colors;
        document.getElementById('picker-mobile').value = c.mobile || '#ff0000';
        document.getElementById('picker-card').value = c.card || '#00ffff';
        document.getElementById('picker-bank').value = c.bank || '#ffff00';
        document.getElementById('picker-cash').value = c.cash || '#00ff00';

        curPlatform = '';
        curCard = '';
        updateMainMethodStyles();
        renderQuickItems();
        renderSubMethods();
        renderHistory();
        alert('設定文檔匯入成功！');
      } catch (err) {
        alert('檔案讀取失敗，請確認檔案格式是否正確。');
      }
    };
    reader.readAsText(file);
  }

  init();
</script>
