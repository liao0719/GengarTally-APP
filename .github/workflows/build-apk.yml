name: Build Offline Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 設定 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 初始化本地容器與配置
        run: |
          mkdir -p www
          cp index.html www/
          cp gengar.png www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.gengar.tally",
            "appName": "極簡記帳",
            "webDir": "www"
          }
          EOF
          
          npx cap add android
          npx cap sync android

      - name: 替換 App 桌面耿鬼圖示
        run: |
          find android/app/src/main/res/ -name "ic_launcher*.png" -exec cp gengar.png {} \; 2>/dev/null || true
          find android/app/src/main/res/ -name "ic_launcher*.webp" -exec cp gengar.png {} \; 2>/dev/null || true

      - name: 編譯生成 Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 上傳編譯成品 (APK Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: GengarTally-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
