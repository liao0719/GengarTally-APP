name: Build Offline Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 設定 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 鎖定永久簽章金鑰，支援日後無縫覆蓋安裝
      - name: 準備固定數位簽章金鑰
        run: |
          mkdir -p ~/.android
          if [ ! -f "gengar-debug.keystore" ]; then
            echo "首次編譯：建立專屬永久簽章金鑰..."
            keytool -genkeypair -v \
              -keystore gengar-debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=GengarTally,OU=Mobile,O=Gengar,L=TW,S=TW,C=TW"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add gengar-debug.keystore
            git commit -m "ci: 建立永久簽章金鑰 [skip ci]"
            git push
          fi
          cp gengar-debug.keystore ~/.android/debug.keystore

      # 初始化本地容器，並將 GitHub 動態版本號注入 index.html
      - name: 初始化本地容器與配置
        run: |
          mkdir -p www
          cp index.html www/
          cp gengar.png www/
          
          # 將 index.html 內的靜態版本標籤自動替換為動態版本號 (如 v1.0.25)
          sed -i "s/<span class=\"modal-version-tag\">.*<\/span>/<span class=\"modal-version-tag\">v1.0.${{ github.run_number }}<\/span>/g" www/index.html
          sed -i "s/GengarTally v[0-9.]* (離線版)/GengarTally v1.0.${{ github.run_number }} (離線版)/g" www/index.html

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.gengar.tally",
            "appName": "GengarTally",
            "webDir": "www"
          }
          EOF
          
          npx cap add android
          npx cap sync android

      - name: 替換 App 桌面耿鬼圖示與背景色
        run: |
          find android/app/src/main/res/ -name "ic_launcher*.png" -exec cp gengar.png {} \; 2>/dev/null || true
          find android/app/src/main/res/ -name "ic_launcher*.webp" -exec cp gengar.png {} \; 2>/dev/null || true
          sed -i 's/#FFFFFF/#09090b/g' android/app/src/main/res/values/ic_launcher_background.xml 2>/dev/null || true
          sed -i 's|services.gradle.org/distributions|cache-redirector.jetbrains.com/services.gradle.org/distributions|g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/-all.zip/-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties

      # 注入 Android 原生下載 (MediaStore) 與分享橋接器
      - name: 注入原生檔案下載與分享功能
        run: |
          cat << 'EOF' > android/app/src/main/java/com/gengar/tally/MainActivity.java
          package com.gengar.tally;

          import android.os.Bundle;
          import android.os.Build;
          import android.os.Environment;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getBridge().getWebView().addJavascriptInterface(new NativeBridge(), "AndroidBridge");
              }

              public class NativeBridge {
                  @JavascriptInterface
                  public boolean downloadTextFile(String filename, String content) {
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, filename);
                              values.put(MediaStore.Downloads.MIME_TYPE, "text/plain");
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri != null) {
                                  OutputStream os = getContentResolver().openOutputStream(uri);
                                  if (os != null) {
                                      os.write(content.getBytes(StandardCharsets.UTF_8));
                                      os.close();
                                  }
                              }
                          } else {
                              File file = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), filename);
                              FileOutputStream fos = new FileOutputStream(file);
                              fos.write(content.getBytes(StandardCharsets.UTF_8));
                              fos.close();
                          }
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "已成功下載至「下載 (Download)」資料夾！", Toast.LENGTH_LONG).show());
                          return true;
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "下載失敗：" + e.getMessage(), Toast.LENGTH_SHORT).show());
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public void shareText(String title, String content) {
                      try {
                          Intent intent = new Intent(Intent.ACTION_SEND);
                          intent.setType("text/plain");
                          intent.putExtra(Intent.EXTRA_SUBJECT, title);
                          intent.putExtra(Intent.EXTRA_TEXT, content);
                          Intent chooser = Intent.createChooser(intent, "分享設定文檔");
                          chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(chooser);
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "分享失敗", Toast.LENGTH_SHORT).show());
                      }
                  }
              }
          }
          EOF

      # 自動將 Android 底層 versionCode 與 versionName 遞增對齊 GitHub 執行編號
      - name: 自動遞增 Android 版本序號
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/g" android/app/build.gradle

      - name: 編譯生成 Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../GengarTally.apk

      - name: 自動發布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: GengarTally v1.0.${{ github.run_number }}
          body: |
            ### GengarTally 自動編譯版本 (v1.0.${{ github.run_number }})
            * 內部版本序號 (versionCode)：${{ github.run_number }}
            * 畫面版本標籤：v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: GengarTally.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
