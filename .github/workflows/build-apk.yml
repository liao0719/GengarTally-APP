name: Build Offline Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 設定 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 加入官方 Gradle 快取與加速套件
      - name: 設定 Gradle 環境
        uses: gradle/actions/setup-gradle@v4

      - name: 初始化本地容器與配置
        run: |
          mkdir -p www
          cp index.html www/
          cp gengar.png www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.gengar.tally",
            "appName": "GengarTally",
            "webDir": "www"
          }
          EOF
          
          npx cap add android
          npx cap sync android

      - name: 替換 App 桌面耿鬼圖示與背景色
        run: |
          # 1. 替換所有自適應前景圖與傳統圖示
          find android/app/src/main/res/ -name "ic_launcher*.png" -exec cp gengar.png {} \; 2>/dev/null || true
          find android/app/src/main/res/ -name "ic_launcher*.webp" -exec cp gengar.png {} \; 2>/dev/null || true
          
          # 2. 將預設白色背景替換為 App 暗黑底色
          sed -i 's/#FFFFFF/#09090b/g' android/app/src/main/res/values/ic_launcher_background.xml 2>/dev/null || true
          
          # 3. 將 Gradle 下載包改為體積更小更快的 -bin.zip，避免 504 逾時
          sed -i 's/-all.zip/-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true

      - name: 編譯生成 Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上傳編譯成品 (APK Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: GengarTally-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
